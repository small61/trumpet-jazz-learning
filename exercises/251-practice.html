<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>251 和弦音练习｜小号爵士学习</title><link rel="stylesheet" href="../assets/style.css"><style>select,input,button{font:inherit;padding:.5rem;max-width:100%}.controls{display:flex;gap:1rem;flex-wrap:wrap}.bars{display:grid;gap:1rem}.notes{font:600 1.5rem/2 monospace;word-spacing:.6rem}button{cursor:pointer}small{display:block;color:var(--muted)}</style></head>
<body><nav><a href="../index.html">← 学习主页</a></nav><header class="hero"><div class="eyebrow">ii · V · I</div><h1>251 和弦音练习</h1><p>先唱再吹：每小节四个四分音符，用根音、三音、五音、七音连接三个和弦。</p></header>
<div class="card controls"><label>记谱调性 <select id="key"></select></label><label>速度 <input id="tempo" type="number" min="40" max="200" value="80" step="5"> BPM</label><label>节奏 <select id="rhythm"><option value="straight">四分音符 · 均匀</option><option value="longshort">前长后短 · 变奏</option></select></label><label>音高 <select id="instrument"><option value="bb">B♭ 小号记谱（播放低大二度）</option><option value="concert">实际音高</option></select></label></div>
<div class="controls"><button id="generate">换一组旋律</button><button id="play">循环播放</button><button id="stop">停止</button></div><p id="status" role="status" aria-live="polite">准备练习</p><div id="score" class="bars"></div>
<div class="callout"><strong>节奏说明</strong><p>均匀模式是 4/4 拍，每小节四个四分音符。前长后短模式采用“附点四分音符＋八分音符”两次，总长仍为四拍，但不再是四个四分音符；它也不同于通常的摇摆八分音符。</p><p>本练习每小节包含四种和弦音各一次。真实即兴可以重复音，也可以省略部分和弦音，不必每小节把和弦填满。</p></div>
<p>音名后的数字表示八度（C4 为中央 C）。从舒适音区慢练；循环共三小节，I 级占一小节。</p><script src="../assets/251-practice.js"></script></body></html>
